<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Registrasi Seminar</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Formulir Registrasi Seminar</h1>
        <p class="deskripsi">
            Silakan lengkapi data diri dan pilihan seminar untuk melakukan pendaftaran.
        </p>

        <form action="" method="post" enctype="multipart/form-data">

            <h2>Informasi Peserta</h2>
            <table>
                <tbody>
                    <tr>
                        <td class="label-cell">
                            <label for="nama">Nama Lengkap</label>
                        </td>
                        <td>
                            <input type="text" id="nama" name="nama" />
                        </td>
                    </tr>

                    <tr>
                        <td class="label-cell">
                            <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
                        </td>
                        <td>
                            <input type="text" id="nim" name="nim" />
                        </td>
                    </tr>

                    <tr>
                        <td class="label-cell">Jenis Kelamin</td>
                        <td>
                            <div class="pilihan">
                                <input type="radio" id="laki" name="jk" value="Laki-laki" />
                                <label for="laki">Laki-laki</label>

                                <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                                <label for="perempuan">Perempuan</label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="label-cell">
                            <label for="program_studi">Program Studi</label>
                        </td>
                        <td>
                            <select id="program_studi" name="program_studi">
                                <option value="Informatika">Informatika</option>
                                <option value="Sistem Informasi">Sistem Informasi</option>
                                <option value="Teknik Industri">Teknik Industri</option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>

            <h2>Pendaftaran Seminar</h2>
            <table>
                <tbody>
                    <tr>
                        <td class="label-cell">Kategori Tiket</td>
                        <td>
                            <div class="pilihan">
                                <input type="radio" id="reguler" name="tiket" value="Reguler" />
                                <label for="reguler">Reguler</label>

                                <input type="radio" id="vip" name="tiket" value="VIP" />
                                <label for="vip">VIP</label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="label-cell">Topik yang Diminati</td>
                        <td>
                            <div class="daftar-topik">
                                <div>
                                    <input type="checkbox" id="web" name="topik" value="Web Development" />
                                    <label for="web">Web Development</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="data" name="topik" value="Data Science" />
                                    <label for="data">Data Science</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                                    <label for="ai">Artificial Intelligence</label>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <h2>Informasi Tambahan</h2>
            <table>
                <tbody>
                    <tr>
                        <td class="label-cell">
                            <label for="alasan">Motivasi Mengikuti Seminar</label>
                        </td>
                        <td>
                            <textarea id="alasan" name="alasan" rows="5" cols="40"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td class="label-cell">
                            <label for="bukti_pembayaran">Unggah Bukti Pembayaran</label>
                        </td>
                        <td>
                            <input type="file" id="bukti_pembayaran" name="bukti_pembayaran" />
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="tombol-cell">
                            <input type="submit" name="simpan" value="Daftar Sekarang" />
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>

        <p class="catatan">
            Periksa kembali data dan pilihan Anda sebelum mengirim formulir.
        </p>
    </div>
</body>
</html>
